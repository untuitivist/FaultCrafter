[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faultcrafter"
version = "0.1.0"
description = "Condition-controlled vibration generation with a shared CLI and local GUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "torch>=2.4,<3"]

[project.optional-dependencies]
training = ["scipy>=1.10,<2", "scikit-learn>=1.3,<2"]
dev = ["pytest>=8,<9", "build>=1.2,<2"]
desktop = ["pyinstaller>=6,<7"]

[project.scripts]
faultcrafter = "faultcrafter.cli:main"

[project.urls]
Repository = "https://github.com/untuitivist/FaultCrafter"

[tool.setuptools.packages.find]
include = ["faultcrafter*"]
exclude = ["research*", "tests*", "desktop*"]

[tool.setuptools.package-data]
faultcrafter = ["gui/assets/*.html", "gui/assets/*.js", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
